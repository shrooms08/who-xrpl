  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ay:flex;flex-direction:column;gap:30px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px\">\n        <div style=\"font-family:'Permanent Marker',cursive;font-size:38px;line-height:1\">THE PARTS<\u002Fdiv>\n        <div style=\"font-size:17px;color:#5C554A\">eyes ×10 · mouths ×10 · marks ×8 + none — stack in order, no per-combo tweaks<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A;border-bottom:1.5px solid #201d1855;padding-bottom:6px\">EYES — eyes-01 … eyes-10<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:18px\">\n          <sc-for list=\"{{eyes}}\" as=\"p\" hint-placeholder-count=\"10\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n              <div style=\"position:relative;width:104px;height:104px\">\n                <img src=\"d003dc2b-4726-4b29-ad23-88fb631cc9b3\" style=\"position:absolute;inset:0;width:104px;height:104px\">\n                <img src=\"{{p.src}}\" style=\"position:absolute;inset:0;width:104px;height:104px\">\n              <\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:11px\">{{p.id}}<\u002Fdiv>\n              <div style=\"font-size:15px;color:#5C554A;text-align:center;line-height:1.2\">{{p.name}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A;border-bottom:1.5px solid #201d1855;padding-bottom:6px\">MOUTHS — mouth-01 … mouth-10<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:18px\">\n          <sc-for list=\"{{mouths}}\" as=\"p\" hint-placeholder-count=\"10\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n              <div style=\"position:relative;width:104px;height:104px\">\n                <img src=\"d003dc2b-4726-4b29-ad23-88fb631cc9b3\" style=\"position:absolute;inset:0;width:104px;height:104px\">\n                <img src=\"{{p.src}}\" style=\"position:absolute;inset:0;width:104px;height:104px\">\n              <\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:11px\">{{p.id}}<\u002Fdiv>\n              <div style=\"font-size:15px;color:#5C554A;text-align:center;line-height:1.2\">{{p.name}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A;border-bottom:1.5px solid #201d1855;padding-bottom:6px\">MARKS — optional layer, mark-00 = none (default)<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:18px\">\n          <sc-for list=\"{{marks}}\" as=\"p\" hint-placeholder-count=\"9\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n              <div style=\"position:relative;width:104px;height:104px\">\n                <img src=\"d003dc2b-4726-4b29-ad23-88fb631cc9b3\" style=\"position:absolute;inset:0;width:104px;height:104px\">\n                <img src=\"{{p.src}}\" style=\"position:absolute;inset:0;width:104px;height:104px;opacity:{{p.op}}\">\n                <img src=\"1e10c674-73a7-4d51-b523-0b4391d07f4f\" style=\"position:absolute;inset:0;width:104px;height:104px;opacity:.22\">\n                <img src=\"cc83f537-03ee-414a-bfd2-138cfd16e343\" style=\"position:absolute;inset:0;width:104px;height:104px;opacity:.22\">\n              <\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:11px\">{{p.id}}<\u002Fdiv>\n              <div style=\"font-size:15px;color:#5C554A;text-align:center;line-height:1.2\">{{p.name}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;color:#5C554A\">ghosted eyes/mouth show placement only — marks never collide with the eye band (y 45–105) or mouth box (y 124–165).<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;border-top:2px dashed #201d1840;padding-top:22px\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">32px LEGIBILITY TEST — every part at real chip size<\u002Fdiv>\n        <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n          <sc-for list=\"{{smallTest}}\" as=\"f\" hint-placeholder-count=\"20\">\n            <div style=\"position:relative;width:32px;height:32px\">\n              <img src=\"d003dc2b-4726-4b29-ad23-88fb631cc9b3\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n              <img src=\"{{f.mark}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n              <img src=\"{{f.eyes}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n              <img src=\"{{f.mouth}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;color:#5C554A\">Simplified after this test: spiral (eyes-07) and zip stitches (mouth-08) dropped to 7px stroke so the shape survives; stubble &amp; blush carry opacity so they read as shading, not features.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1b SPEC SHEET -->\n  <div id=\"1b\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"font-family:'Special Elite',monospace;font-size:12px;background:#201D18;color:#F6F0E2;padding:2px 8px\">1b<\u002Fspan>\n      <span style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A;letter-spacing:.06em\">COMPOSITION SPEC<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1000px;background:#F6F0E2;background-image:radial-gradient(#00000010 1px,transparent 1px);background-size:22px 22px;border:2px solid #201D18;border-radius:11px 15px 12px 14px;padding:34px;display:flex;flex-direction:column;gap:30px\">\n      <div style=\"display:flex;gap:40px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">ANCHOR GRID · 200×200<\u002Fdiv>\n          <div style=\"position:relative;width:260px;height:260px;background:#FBF7EC;border:2px solid #201D18;border-radius:8px 11px 9px 10px\">\n            <div style=\"position:absolute;left:0;right:0;top:106px;border-top:1.5px dashed #D93B25\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;top:186px;border-top:1.5px dashed #1F7A5A\"><\u002Fdiv>\n            <div style=\"position:absolute;top:0;bottom:0;left:88px;border-left:1.5px dashed #8A8272\"><\u002Fdiv>\n            <div style=\"position:absolute;top:0;bottom:0;left:172px;border-left:1.5px dashed #8A8272\"><\u002Fdiv>\n            <img src=\"d003dc2b-4726-4b29-ad23-88fb631cc9b3\" style=\"position:absolute;left:10px;top:10px;width:240px;height:240px;opacity:.5\">\n            <div style=\"position:absolute;top:88px;right:6px;font-family:'Special Elite',monospace;font-size:10px;color:#D93B25\">eye band y=82<\u002Fdiv>\n            <div style=\"position:absolute;top:190px;right:6px;font-family:'Special Elite',monospace;font-size:10px;color:#1F7A5A\">mouth y=143<\u002Fdiv>\n            <div style=\"position:absolute;bottom:6px;left:52px;font-family:'Special Elite',monospace;font-size:10px;color:#8A8272\">x=68<\u002Fdiv>\n            <div style=\"position:absolute;bottom:6px;left:150px;font-family:'Special Elite',monospace;font-size:10px;color:#8A8272\">x=132<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;color:#5C554A;max-width:260px;line-height:1.45\">head r=88 @ (100,100) · cheeks (46,124) &amp; (154,124) · brow band y=56 · jaw arc y=156–174<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;max-width:300px\">\n          <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">LAYER ORDER<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"background:#FBF7EC;border:2px solid #201D18;border-radius:12px 15px 13px 14px;padding:9px 14px;font-size:16px\">1 — head (wobbly circle, card fill + 10px ink)<\u002Fdiv>\n            <div style=\"background:#FBF7EC;border:2px solid #201D18;border-radius:14px 12px 15px 13px;padding:9px 14px;font-size:16px\">2 — mark (optional, mark-00 default)<\u002Fdiv>\n            <div style=\"background:#FBF7EC;border:2px solid #201D18;border-radius:13px 14px 12px 15px;padding:9px 14px;font-size:16px\">3 — eyes<\u002Fdiv>\n            <div style=\"background:#FBF7EC;border:2px solid #201D18;border-radius:15px 13px 14px 12px;padding:9px 14px;font-size:16px\">4 — mouth<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;color:#5C554A;line-height:1.45\">All four SVGs share the same viewBox and are stacked at identical size — no offsets, no per-combination adjustment. Role color never touches the face: it lives on the chip border only.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;max-width:250px\">\n          <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">CHIP STATES<\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:flex-start\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px\">\n              <div style=\"position:relative;width:56px;height:56px\"><img src=\"c799c71a-8417-41a2-b781-435aca8568fa\" style=\"width:56px;height:56px\"><\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:10px\">alive<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px\">\n              <div style=\"position:relative;width:56px;height:56px;opacity:.45\"><img src=\"1479f4cf-f7cb-4d8a-bb4f-383909660489\" style=\"width:56px;height:56px;filter:grayscale(1)\"><svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 52 52\" style=\"position:absolute;left:2px;top:2px\"><path d=\"M9 10l34 33M43 9L10 42\" stroke=\"#D93B25\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:10px;color:#8A8272\">dead<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px\">\n              <div style=\"position:relative;width:56px;height:56px\">\n                <svg width=\"26\" height=\"16\" sc-camel-view-box=\"0 0 26 16\" style=\"position:absolute;left:15px;top:-16px\"><path d=\"M13 14V4m0 0L6 10m7-6l7 6\" stroke=\"#D93B25\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n                <img src=\"ca8f6c80-4f9a-4b71-b1b1-dc301d831ac2\" style=\"width:56px;height:56px\">\n                <div style=\"position:absolute;inset:-3px;border:2.5px solid #D93B25;border-radius:52% 48% 45% 55%/45% 52% 48% 55%\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:10px;color:#D93B25\">current turn<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;color:#5C554A;line-height:1.45\">dead = grayscale + 45% + scribbled X · current = hot wobble ring + arrow · host = ★ at top-right<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px;border-top:2px dashed #201d1840;padding-top:24px\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">12 COMPOSED FACES — RANGE CHECK<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:18px\">\n          <sc-for list=\"{{examples}}\" as=\"f\" hint-placeholder-count=\"12\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n              <div style=\"position:relative;width:112px;height:112px\">\n                <img src=\"d003dc2b-4726-4b29-ad23-88fb631cc9b3\" style=\"position:absolute;inset:0;width:112px;height:112px\">\n                <img src=\"{{f.mark}}\" style=\"position:absolute;inset:0;width:112px;height:112px\">\n                <img src=\"{{f.eyes}}\" style=\"position:absolute;inset:0;width:112px;height:112px\">\n                <img src=\"{{f.mouth}}\" style=\"position:absolute;inset:0;width:112px;height:112px\">\n              <\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:10px;color:#5C554A;text-align:center;line-height:1.3\">{{f.recipe}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px;border-top:2px dashed #201d1840;padding-top:24px\">\n        <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">ROGUES GALLERY — LOBBY ROSTER, 6 PLAYERS SIDE BY SIDE<\u002Fdiv>\n        <div style=\"width:390px;background:#F6F0E2;border:2px solid #201D18;border-radius:12px 15px 11px 14px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n            <div style=\"font-family:'Permanent Marker',cursive;font-size:24px\">IN THE ROOM<\u002Fdiv>\n            <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">6 / 10<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{roster}}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:12px;background:#FBF7EC;border:2px solid #201D18;border-radius:{{r.radius}};padding:8px 12px\">\n              <div style=\"position:relative;width:44px;height:44px;flex-shrink:0\">\n                <img src=\"d003dc2b-4726-4b29-ad23-88fb631cc9b3\" style=\"position:absolute;inset:0;width:44px;height:44px\">\n                <img src=\"{{r.mark}}\" style=\"position:absolute;inset:0;width:44px;height:44px\">\n                <img src=\"{{r.eyes}}\" style=\"position:absolute;inset:0;width:44px;height:44px\">\n                <img src=\"{{r.mouth}}\" style=\"position:absolute;inset:0;width:44px;height:44px\">\n              <\u002Fdiv>\n              <div style=\"font-family:'Permanent Marker',cursive;font-size:19px\">{{r.name}}<\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"font-family:'Special Elite',monospace;font-size:11px;color:{{r.tagColor}}\">{{r.tag}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;align-items:center;gap:12px;border:2px dashed #8A8272;border-radius:14px 12px 15px 13px;padding:8px 12px\">\n            <div style=\"width:44px;height:44px;border:2px dashed #8A8272;border-radius:52% 48% 45% 55%/45% 52% 48% 55%;display:flex;align-items:center;justify-content:center;font-family:'Permanent Marker',cursive;font-size:18px;color:#8A8272\">?<\u002Fdiv>\n            <div style=\"font-size:16px;color:#8A8272\">empty seat<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1d PAPER TINTS -->\n  <div id=\"1d\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"font-family:'Special Elite',monospace;font-size:12px;background:#201D18;color:#F6F0E2;padding:2px 8px\">1d<\u002Fspan>\n      <span style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A;letter-spacing:.06em\">PAPER TINTS — HEAD GROUND ONLY<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:1000px;background:#F6F0E2;background-image:radial-gradient(#00000010 1px,transparent 1px);background-size:22px 22px;border:2px solid #201D18;border-radius:15px 12px 14px 11px;padding:34px;display:flex;flex-direction:column;gap:26px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\">\n        <div style=\"font-family:'Permanent Marker',cursive;font-size:34px;line-height:1\">PICK YOUR PAPER<\u002Fdiv>\n        <div style=\"font-size:17px;color:#5C554A\">8 tints + default — ink linework unchanged. No tint reads red or green: those stay reserved for imposter / crew.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(9,1fr);gap:14px\">\n        <sc-for list=\"{{paperSheet}}\" as=\"t\" hint-placeholder-count=\"9\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <div style=\"position:relative;width:96px;height:96px\">\n              <img src=\"{{t.head}}\" style=\"position:absolute;inset:0;width:96px;height:96px\">\n              <img src=\"{{t.mark}}\" style=\"position:absolute;inset:0;width:96px;height:96px\">\n              <img src=\"{{t.eyes}}\" style=\"position:absolute;inset:0;width:96px;height:96px\">\n              <img src=\"{{t.mouth}}\" style=\"position:absolute;inset:0;width:96px;height:96px\">\n            <\u002Fdiv>\n            <div style=\"position:relative;width:32px;height:32px\">\n              <img src=\"{{t.head}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n              <img src=\"{{t.mark}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n              <img src=\"{{t.eyes}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n              <img src=\"{{t.mouth}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n            <\u002Fdiv>\n            <div style=\"font-family:'Special Elite',monospace;font-size:10px\">{{t.id}}<\u002Fdiv>\n            <div style=\"font-size:14px;color:#5C554A;text-align:center;line-height:1.2\">{{t.name}}<br><span style=\"font-family:'Special Elite',monospace;font-size:10px;color:#8A8272\">{{t.hex}}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:36px;flex-wrap:wrap;border-top:2px dashed #201d1840;padding-top:22px\">\n        <div style=\"font-size:16px;color:#5C554A;max-width:420px;line-height:1.5\">\n          <span style=\"font-family:'Special Elite',monospace;font-size:12px;color:#201D18\">LEGIBILITY PASS —<\u002Fspan> every tint sits at L* 80–92 so 10px ink strokes hold at 32px. Clay (paper-08) was the only muddy one at chip size: lightened from a deeper terracotta to #E0B9A2 so the mouth arc doesn't sink. Eraser pink and clay are the two closest to hot ink — both kept desaturated and light so they never read as an accusation.\n        <\u002Fdiv>\n        <div style=\"font-size:16px;color:#5C554A;max-width:420px;line-height:1.5\">\n          <span style=\"font-family:'Special Elite',monospace;font-size:12px;color:#201D18\">SEMANTIC SAFETY —<\u002Fspan> tint is decoration, never state. Role and turn signals stay on the chip ring (hot #D93B25 / calm #1F7A5A) and on the dead-state scribble, all drawn outside the head, so a tinted face can never be confused with an imposter reveal. Files: <span style=\"font-family:'Special Elite',monospace;font-size:12px\">head-paper-00 … head-paper-08.svg<\u002Fspan> — swap the head layer, the other three layers are untouched.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1c COMPOSER -->\n  <div id=\"1c\" style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"font-family:'Special Elite',monospace;font-size:12px;background:#201D18;color:#F6F0E2;padding:2px 8px\">1c<\u002Fspan>\n      <span style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A;letter-spacing:.06em\">FACE COMPOSER — 390px, LIVE<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:390px;height:844px;background:#F6F0E2;background-image:radial-gradient(#00000010 1px,transparent 1px);background-size:22px 22px;border:2px solid #201D18;border-radius:12px 14px 11px 15px;overflow:hidden;display:flex;flex-direction:column\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 22px 8px\">\n        <div style=\"font-family:'Permanent Marker',cursive;font-size:28px;transform:rotate(-1deg)\">YOUR FACE<\u002Fdiv>\n        <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">step 2 of 2<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:18px;padding:6px 22px 14px\">\n        <div style=\"position:relative;width:170px;height:170px\">\n          <img src=\"{{sel.head}}\" style=\"position:absolute;inset:0;width:170px;height:170px\">\n          <img src=\"{{sel.mark}}\" style=\"position:absolute;inset:0;width:170px;height:170px\">\n          <img src=\"{{sel.eyes}}\" style=\"position:absolute;inset:0;width:170px;height:170px\">\n          <img src=\"{{sel.mouth}}\" style=\"position:absolute;inset:0;width:170px;height:170px\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center;padding-bottom:12px\">\n          <div style=\"position:relative;width:32px;height:32px\">\n            <img src=\"{{sel.head}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n            <img src=\"{{sel.mark}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n            <img src=\"{{sel.eyes}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n            <img src=\"{{sel.mouth}}\" style=\"position:absolute;inset:0;width:32px;height:32px\">\n          <\u002Fdiv>\n          <div style=\"font-family:'Special Elite',monospace;font-size:9px;color:#5C554A;text-align:center;line-height:1.3\">how others<br>see you<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-bottom:14px\">\n          <div style=\"font-family:'Permanent Marker',cursive;font-size:17px;transform:rotate(-3deg)\">nice.<\u002Fdiv>\n          <svg width=\"52\" height=\"26\" sc-camel-view-box=\"0 0 52 26\"><path d=\"M4 4c14 12 30 16 44 16m0 0l-9-6m9 6l-10 4\" fill=\"none\" stroke=\"#201D18\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:8px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:0 22px\">\n          <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">EYES<\u002Fdiv>\n          <div style=\"font-family:'Special Elite',monospace;font-size:11px;color:#8A8272\">{{eyesLabel}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"noscroll\" style=\"display:flex;gap:10px;padding:4px 22px 6px;overflow-x:auto\">\n          <sc-for list=\"{{eyesRow}}\" as=\"p\" hint-placeholder-count=\"10\">\n            <div sc-camel-on-click=\"{{p.pick}}\" style=\"position:relative;width:58px;height:58px;flex-shrink:0;cursor:pointer;border:{{p.border}};border-radius:52% 48% 45% 55%/45% 52% 48% 55%;background:{{p.bg}};box-shadow:{{p.shadow}}\">\n              <img src=\"{{p.src}}\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:8px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:0 22px\">\n          <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">MOUTH<\u002Fdiv>\n          <div style=\"font-family:'Special Elite',monospace;font-size:11px;color:#8A8272\">{{mouthLabel}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"noscroll\" style=\"display:flex;gap:10px;padding:4px 22px 6px;overflow-x:auto\">\n          <sc-for list=\"{{mouthRow}}\" as=\"p\" hint-placeholder-count=\"10\">\n            <div sc-camel-on-click=\"{{p.pick}}\" style=\"position:relative;width:58px;height:58px;flex-shrink:0;cursor:pointer;border:{{p.border}};border-radius:48% 52% 55% 45%/55% 48% 52% 45%;background:{{p.bg}};box-shadow:{{p.shadow}}\">\n              <img src=\"{{p.src}}\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:0 22px\">\n          <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">MARK <span style=\"color:#8A8272\">(optional)<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:'Special Elite',monospace;font-size:11px;color:#8A8272\">{{markLabel}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"noscroll\" style=\"display:flex;gap:10px;padding:4px 22px 6px;overflow-x:auto\">\n          <sc-for list=\"{{markRow}}\" as=\"p\" hint-placeholder-count=\"9\">\n            <div sc-camel-on-click=\"{{p.pick}}\" style=\"position:relative;width:58px;height:58px;flex-shrink:0;cursor:pointer;border:{{p.border}};border-radius:45% 55% 48% 52%/52% 45% 55% 48%;background:{{p.bg}};box-shadow:{{p.shadow}};display:flex;align-items:center;justify-content:center\">\n              <img src=\"{{p.src}}\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n              <sc-if value=\"{{p.isNone}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"font-family:'Special Elite',monospace;font-size:11px;color:#8A8272\">none<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:8px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:0 22px\">\n          <div style=\"font-family:'Special Elite',monospace;font-size:12px;color:#5C554A\">PAPER<\u002Fdiv>\n          <div style=\"font-family:'Special Elite',monospace;font-size:11px;color:#8A8272\">{{paperLabel}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"noscroll\" style=\"display:flex;gap:10px;padding:4px 22px 6px;overflow-x:auto\">\n          <sc-for list=\"{{paperRow}}\" as=\"p\" hint-placeholder-count=\"9\">\n            <div sc-camel-on-click=\"{{p.pick}}\" style=\"width:52px;height:52px;flex-shrink:0;cursor:pointer;border:{{p.border}};border-radius:50% 50% 46% 54%/54% 46% 50% 50%;background:{{p.hex}};box-shadow:{{p.shadow}}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;padding:14px 22px 22px;border-top:2px solid #201D18;background:#F6F0E2\">\n        <div sc-camel-on-click=\"{{randomize}}\" style=\"width:56px;height:52px;border:2px solid #201D18;border-radius:14px 12px 15px 13px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#FBF7EC\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 26 26\"><path d=\"M4 5h17c1 0 1.5.6 1.5 1.6v13c0 1-.6 1.6-1.6 1.6H5c-1 0-1.5-.6-1.5-1.6V6.6C3.5 5.6 4 5 4.6 5\" fill=\"none\" stroke=\"#201D18\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"9\" cy=\"10\" r=\"1.9\" fill=\"#201D18\"><\u002Fcircle><circle cx=\"17\" cy=\"10\" r=\"1.9\" fill=\"#201D18\"><\u002Fcircle><circle cx=\"13\" cy=\"13.5\" r=\"1.9\" fill=\"#D93B25\"><\u002Fcircle><circle cx=\"9\" cy=\"17\" r=\"1.9\" fill=\"#201D18\"><\u002Fcircle><circle cx=\"17\" cy=\"17\" r=\"1.9\" fill=\"#201D18\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:#201D18;color:#F6F0E2;font-family:'Permanent Marker',cursive;font-size:22px;text-align:center;padding:12px;border-radius:15px 225px 15px 255px/255px 15px 225px 15px\">SAVE FACE<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:15px;color:#5C554A;max-width:390px\">Tap any part to swap it live · dice re-rolls all three · selected part sits on a hot-ink wobble ring with a hard offset shadow.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { eyes: 1, mouth: 1, mark: 4, paper: 1, ready: false };\n  componentDidMount(){\n    if (!window.WHO_FACE_PARTS) {\n      this.poll = setInterval(() => { if (window.WHO_FACE_PARTS) { clearInterval(this.poll); this.setState({ready:true}); } }, 60);\n    }\n  }\n  componentWillUnmount(){ clearInterval(this.poll); }\n  src(id){ var r = (typeof window !== 'undefined' && window.__resources) || {}; return r[id] || 'assets/faces/' + id + '.svg'; }\n  renderVals(){\n    const P = window.WHO_FACE_PARTS || {eyes:[],mouths:[],marks:[]};\n    const HOT = '#D93B25', INK = '#201D18';\n    const s = this.state;\n    const pad = n => String(n).padStart(2,'0');\n    const eyesId = 'eyes-' + pad(s.eyes), mouthId = 'mouth-' + pad(s.mouth), markId = 'mark-' + pad(s.mark);\n    const meta = (list, id) => (list.find(p => p.id === id) || {name:''}).name;\n    const row = (list, key, cur) => list.map(p => {\n      const n = parseInt(p.id.split('-')[1], 10);\n      const on = n === cur;\n      return {\n        id: p.id, src: this.src(p.id), isNone: p.id === 'mark-00',\n        border: on ? '2.5px solid ' + HOT : '2px solid ' + INK,\n        bg: on ? '#FFFDF5' : '#FBF7EC',\n        shadow: on ? '3px 4px 0 ' + HOT + '55' : '2px 3px 0 #201d1826',\n        pick: () => this.setState({[key]: n})\n      };\n    });\n    const face = (e, m, k) => ({ eyes: this.src('eyes-' + pad(e)), mouth: this.src('mouth-' + pad(m)), mark: this.src('mark-' + pad(k)), recipe: pad(e) + ' / ' + pad(m) + ' / ' + pad(k) });\n    const exampleRecipes = [[1,5,1],[2,2,4],[3,1,0],[4,9,3],[5,4,2],[6,7,1],[7,3,0],[8,2,7],[9,1,0],[10,10,8],[2,6,5],[5,8,6]];\n    const rosterData = [\n      {name:'ZARA', e:2, m:2, k:4, tag:'HOST', tagColor:HOT, radius:'14px 12px 15px 13px'},\n      {name:'KOFI', e:9, m:1, k:0, tag:'ready', tagColor:'#1F7A5A', radius:'12px 15px 13px 14px'},\n      {name:'MIRA', e:1, m:5, k:1, tag:'ready', tagColor:'#1F7A5A', radius:'15px 13px 12px 14px'},\n      {name:'DEDE', e:8, m:9, k:7, tag:'ready', tagColor:'#1F7A5A', radius:'13px 14px 15px 12px'},\n      {name:'JUNO', e:3, m:6, k:5, tag:'picking a face…', tagColor:'#8A8272', radius:'14px 15px 12px 13px'},\n      {name:'TAO', e:5, m:4, k:2, tag:'ready', tagColor:'#1F7A5A', radius:'12px 13px 14px 15px'}\n    ];\n    const smallTest = [];\n    for (let i = 1; i <= 10; i++) smallTest.push(face(i, i, 0));\n    for (let i = 1; i <= 8; i++) smallTest.push(face(4, 1, i));\n    smallTest.push(face(7, 8, 4));\n    smallTest.push(face(10, 10, 6));\n    return {\n      eyes: P.eyes.map(p => ({...p, src: this.src(p.id)})),\n      mouths: P.mouths.map(p => ({...p, src: this.src(p.id)})),\n      marks: P.marks.map(p => ({...p, src: this.src(p.id), op: 1})),\n      eyesRow: row(P.eyes, 'eyes', s.eyes),\n      mouthRow: row(P.mouths, 'mouth', s.mouth),\n      markRow: row(P.marks, 'mark', s.mark),\n      sel: { eyes: this.src(eyesId), mouth: this.src(mouthId), mark: this.src(markId), head: this.src('head-paper-' + pad(s.paper)) },\n      paperRow: (P.papers || []).map(p => {\n        const n = parseInt(p.id.split('-')[1], 10);\n        const on = n === s.paper;\n        return { hex: p.hex,\n          border: on ? '2.5px solid ' + HOT : '2px solid ' + INK,\n          shadow: on ? '3px 4px 0 ' + HOT + '55' : '2px 3px 0 #201d1826',\n          pick: () => this.setState({paper: n}) };\n      }),\n      paperLabel: 'paper-' + pad(s.paper) + ' · ' + ((P.papers || []).find(p => p.id === 'paper-' + pad(s.paper)) || {name:''}).name,\n      paperSheet: (P.papers || []).map((p, i) => ({\n        id: p.id, name: p.name, hex: p.hex,\n        head: this.src('head-' + p.id),\n        eyes: this.src('eyes-' + pad([2,1,8,5,3,9,6,10,4][i] || 1)),\n        mouth: this.src('mouth-' + pad([2,5,9,4,1,10,7,6,3][i] || 1)),\n        mark: this.src('mark-' + pad([0,1,7,2,4,0,3,8,6][i] || 0))\n      })),\n      eyesLabel: eyesId + ' · ' + meta(P.eyes, eyesId),\n      mouthLabel: mouthId + ' · ' + meta(P.mouths, mouthId),\n      markLabel: markId + ' · ' + meta(P.marks, markId),\n      examples: exampleRecipes.map(r => face(r[0], r[1], r[2])),\n      roster: rosterData.map(r => ({...face(r.e, r.m, r.k), name:r.name, tag:r.tag, tagColor:r.tagColor, radius:r.radius})),\n      smallTest,\n      randomize: () => this.setState({\n        eyes: 1 + Math.floor(Math.random()*10),\n        mouth: 1 + Math.floor(Math.random()*10),\n        mark: Math.floor(Math.random()*9),\n        paper: Math.floor(Math.random()*9)\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
