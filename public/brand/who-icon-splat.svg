<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#000000" opacity="0.06"/>
    </pattern>
  </defs>
  <!-- paper card + subtle dot grid -->
  <rect x="0" y="0" width="1024" height="1024" rx="72" fill="#F6F0E2"/>
  <rect x="0" y="0" width="1024" height="1024" rx="72" fill="url(#dots)"/>
  <!-- hand-drawn ink frame (wobble radius) -->
  <rect x="70" y="70" width="884" height="884" rx="80" ry="64" fill="none" stroke="#201D18" stroke-width="14"/>
  <!-- soft shadow behind the splat -->
  <circle cx="524" cy="516" r="292" fill="#201D18" opacity="0.12"/>
  <!-- red splat: main disc + satellite droplets -->
  <g fill="#D93B25">
    <circle cx="500" cy="500" r="292"/>
    <circle cx="792" cy="320" r="30"/>
    <circle cx="858" cy="278" r="46"/>
    <circle cx="905" cy="356" r="17"/>
    <circle cx="700" cy="762" r="30"/>
    <circle cx="176" cy="792" r="42"/>
    <circle cx="248" cy="856" r="13"/>
    <circle cx="828" cy="828" r="10"/>
  </g>
  <!-- paper "?" (drawn as a marker stroke, no font dependency) -->
  <path d="M366 404 C356 250 648 242 650 416 C651 546 500 530 500 610"
        fill="none" stroke="#FBF7EC" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="500" cy="706" r="47" fill="#FBF7EC"/>
</svg>
